name: ZEPHYS
options:
  bundleIdPrefix: com.zephys
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ZEPHYS:
    type: application
    platform: iOS
    sources:
      - path: ZEPHYS
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ZIPFoundation
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ZEPHYS
        CFBundleName: ZEPHYS
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: ""
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.debian.deb-package
            UTTypeDescription: Debian Package
            UTTypeConformsTo:
              - public.data
              - public.item
            UTTypeTagSpecification:
              public.filename-extension:
                - deb
          - UTTypeIdentifier: com.zephys.binary-archive
            UTTypeDescription: Binary archive
            UTTypeConformsTo:
              - public.data
              - public.item
            UTTypeTagSpecification:
              public.filename-extension:
                - xz
                - zst
                - bz2
                - dylib
                - car
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zephys.app
        PRODUCT_NAME: ZEPHYS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_BITCODE: NO
